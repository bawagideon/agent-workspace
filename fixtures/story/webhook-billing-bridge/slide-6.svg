      <stop offset="50%" stop-color="#0F172A" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#030712" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula-secondary-6" cx="85%" cy="75%" r="60%">
