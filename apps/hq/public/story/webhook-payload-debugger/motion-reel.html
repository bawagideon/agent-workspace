<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gideon AI // WEBHOOK-PAYLOAD-DEBUGGER 3D Cinema Motion Reel</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030712;
      color: #F8FAFC;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .ambient-glow {
      position: fixed;
      width: 700px;
      height: 700px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(16, 185, 129, 0.15) 0%, rgba(14, 165, 233, 0.08) 50%, transparent 70%);
      pointer-events: none;
      z-index: 0;
      animation: pulseGlow 8s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      0% { transform: scale(0.9) translate(-50px, -50px); opacity: 0.7; }
      100% { transform: scale(1.1) translate(50px, 50px); opacity: 1; }
    }

    .reel-container {
      position: relative;
      z-index: 10;
      width: 90vw;
      max-width: 960px;
      aspect-ratio: 1 / 1;
      max-height: 85vh;
      background: #080C16;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8), 0 0 40px rgba(16, 185, 129, 0.15);
      overflow: hidden;
      perspective: 1200px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-stage {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slide-stage img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      user-select: none;
    }

    /* HUD Header Overlay */
    .hud-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      padding: 16px 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: linear-gradient(180deg, rgba(3, 7, 18, 0.9) 0%, transparent 100%);
      z-index: 30;
      font-family: monospace;
      font-size: 13px;
    }

    .hud-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(16, 185, 129, 0.15);
      border: 1px solid rgba(16, 185, 129, 0.35);
      padding: 4px 12px;
      border-radius: 9999px;
      color: #34D399;
      font-weight: bold;
    }

    .hud-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10B981;
      box-shadow: 0 0 10px #10B981;
      animation: blink 1.5s infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    /* Scrubber Progress Bar */
    .progress-track {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      z-index: 30;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10B981, #06B6D4, #3B82F6);
      box-shadow: 0 0 12px #10B981;
      transition: width 0.05s linear;
    }

    /* Controls Bar */
    .controls {
      margin-top: 20px;
      display: flex;
      align-items: center;
      gap: 16px;
      z-index: 10;
      font-family: monospace;
      font-size: 13px;
    }

    .btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #F8FAFC;
      padding: 8px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.12);
      border-color: #34D399;
      color: #34D399;
    }

    .btn-play {
      background: rgba(16, 185, 129, 0.2);
      border-color: rgba(16, 185, 129, 0.5);
      color: #34D399;
    }

    .btn-play:hover {
      background: rgba(16, 185, 129, 0.3);
      color: #6EE7B7;
    }
  </style>
</head>
<body>
  <div class="ambient-glow"></div>

  <div class="reel-container" id="reel">
    <div class="hud-bar">
      <div class="hud-badge">
        <span class="hud-dot"></span>
        <span>DEBUGGER 3D CINEMA MOTION REEL</span>
      </div>
      <div id="slideCounter" style="color: #94A3B8; font-weight: bold;">SLIDE 1 / 8</div>
    </div>

    <div class="slide-stage" id="slideStage">
      <img id="currentSlideImg" src="/story/webhook-payload-debugger/slide-1.svg" alt="Slide" />
    </div>

    <div class="progress-track">
      <div class="progress-bar" id="progressBar"></div>
    </div>
  </div>

  <div class="controls">
    <button class="btn" id="btnPrev">◀ PREV</button>
    <button class="btn btn-play" id="btnTogglePlay">⏸ PAUSE REEL</button>
    <button class="btn" id="btnNext">NEXT ▶</button>
    <button class="btn" id="btnRestart">↺ RESTART</button>
  </div>

  <script>
    const slides = [
      "/story/webhook-payload-debugger/slide-1.svg",
      "/story/webhook-payload-debugger/slide-2.svg",
      "/story/webhook-payload-debugger/slide-3.svg",
      "/story/webhook-payload-debugger/slide-4.svg",
      "/story/webhook-payload-debugger/slide-5.svg",
      "/story/webhook-payload-debugger/slide-6.svg",
      "/story/webhook-payload-debugger/slide-7.svg",
      "/story/webhook-payload-debugger/slide-8.svg"
    ];
    let currentIndex = 0;
    let isPlaying = true;
    let progress = 0;
    const duration = 4000;
    const intervalTime = 40;
    const step = (intervalTime / duration) * 100;

    const img = document.getElementById('currentSlideImg');
    const stage = document.getElementById('slideStage');
    const counter = document.getElementById('slideCounter');
    const bar = document.getElementById('progressBar');
    const btnPlay = document.getElementById('btnTogglePlay');

    function showSlide(index, direction = 1) {
      currentIndex = index;
      counter.innerText = 'SLIDE ' + (currentIndex + 1) + ' / ' + slides.length;
      progress = 0;
      bar.style.width = '0%';

      // 3D Keynote Transition Effect
      stage.style.opacity = '0';
      stage.style.transform = direction > 0 ? 'scale(0.96) translateY(10px) rotateX(4deg)' : 'scale(0.96) translateY(-10px) rotateX(-4deg)';
      
      setTimeout(() => {
        img.src = slides[currentIndex];
        stage.style.opacity = '1';
        stage.style.transform = 'scale(1) translateY(0) rotateX(0deg)';
      }, 150);
    }

    setInterval(() => {
      if (!isPlaying) return;
      progress += step;
      if (progress >= 100) {
        showSlide((currentIndex + 1) % slides.length, 1);
      } else {
        bar.style.width = progress + '%';
      }
    }, intervalTime);

    document.getElementById('btnPrev').addEventListener('click', () => {
      showSlide((currentIndex - 1 + slides.length) % slides.length, -1);
    });

    document.getElementById('btnNext').addEventListener('click', () => {
      showSlide((currentIndex + 1) % slides.length, 1);
    });

    document.getElementById('btnRestart').addEventListener('click', () => {
      showSlide(0, 1);
    });

    btnPlay.addEventListener('click', () => {
      isPlaying = !isPlaying;
      btnPlay.innerText = isPlaying ? '⏸ PAUSE REEL' : '▶ PLAY REEL';
      btnPlay.className = isPlaying ? 'btn btn-play' : 'btn';
    });

    // Keyboard Navigation
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowRight' || e.key === ' ') {
        showSlide((currentIndex + 1) % slides.length, 1);
      } else if (e.key === 'ArrowLeft') {
        showSlide((currentIndex - 1 + slides.length) % slides.length, -1);
      }
    });

    // Interactive 3D Cursor Tilt
    const reel = document.getElementById('reel');
    reel.addEventListener('mousemove', (e) => {
      const rect = reel.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      const tiltX = -((y / rect.height) - 0.5) * 12;
      const tiltY = ((x / rect.width) - 0.5) * 12;
      reel.style.transform = 'perspective(1200px) rotateX(' + tiltX + 'deg) rotateY(' + tiltY + 'deg) scale3d(1.01, 1.01, 1.01)';
    });
    reel.addEventListener('mouseleave', () => {
      reel.style.transform = 'perspective(1200px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)';
    });
  </script>
</body>
</html>
