<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="80%">
      <stop offset="0%" stop-color="#0a1024" />
      <stop offset="60%" stop-color="#030712" />
      <stop offset="100%" stop-color="#000208" />
    </radialGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#EC4899" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)" />

  <!-- Grid lines -->
  <g stroke="#ffffff" stroke-opacity="0.04" stroke-width="1">
    <line x1="0" y1="0" x2="0" y2="1080" /><line x1="100" y1="0" x2="100" y2="1080" /><line x1="200" y1="0" x2="200" y2="1080" /><line x1="300" y1="0" x2="300" y2="1080" /><line x1="400" y1="0" x2="400" y2="1080" /><line x1="500" y1="0" x2="500" y2="1080" /><line x1="600" y1="0" x2="600" y2="1080" /><line x1="700" y1="0" x2="700" y2="1080" /><line x1="800" y1="0" x2="800" y2="1080" /><line x1="900" y1="0" x2="900" y2="1080" /><line x1="1000" y1="0" x2="1000" y2="1080" /><line x1="1100" y1="0" x2="1100" y2="1080" /><line x1="1200" y1="0" x2="1200" y2="1080" /><line x1="1300" y1="0" x2="1300" y2="1080" /><line x1="1400" y1="0" x2="1400" y2="1080" /><line x1="1500" y1="0" x2="1500" y2="1080" /><line x1="1600" y1="0" x2="1600" y2="1080" /><line x1="1700" y1="0" x2="1700" y2="1080" /><line x1="1800" y1="0" x2="1800" y2="1080" /><line x1="1900" y1="0" x2="1900" y2="1080" />
    <line x1="0" y1="0" x2="1920" y2="0" /><line x1="0" y1="100" x2="1920" y2="100" /><line x1="0" y1="200" x2="1920" y2="200" /><line x1="0" y1="300" x2="1920" y2="300" /><line x1="0" y1="400" x2="1920" y2="400" /><line x1="0" y1="500" x2="1920" y2="500" /><line x1="0" y1="600" x2="1920" y2="600" /><line x1="0" y1="700" x2="1920" y2="700" /><line x1="0" y1="800" x2="1920" y2="800" /><line x1="0" y1="900" x2="1920" y2="900" /><line x1="0" y1="1000" x2="1920" y2="1000" /><line x1="0" y1="1100" x2="1920" y2="1100" />
  </g>

  <!-- Top Badge -->
  <g transform="translate(120, 100)">
    <rect width="380" height="42" rx="21" fill="#ffffff" fill-opacity="0.05" stroke="#EC4899" stroke-opacity="0.4" stroke-width="1.5" />
    <circle cx="26" cy="21" r="6" fill="#EC4899" />
    <text x="44" y="26" fill="#e2e8f0" font-family="monospace" font-size="16" font-weight="bold" letter-spacing="2">SLIDE 06 / 08 • THE SOLUTION</text>
  </g>

  <!-- Main Slide Title -->
  <text x="120" y="240" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-1">
    Webhook Payload Debugger
  </text>

  <!-- Subtitle Description -->
  <foreignObject x="120" y="280" width="1050" height="160">
    <p xmlns="http://www.w3.org/1999/xhtml" style="color: #94a3b8; font-family: system-ui, sans-serif; font-size: 24px; line-height: 1.5; margin: 0;">
      We engineered a zero-dependency diagnostic engine and interactive sandbox that pinpoints the exact cause of signature failures in milliseconds.
    </p>
  </foreignObject>

  <!-- 3D Isometric Card Graphic (Right Side) -->
  <g transform="translate(1300, 360)">
    <!-- Base Plate Shadow -->
    <path d="M 0 100 L 260 230 L 0 360 L -260 230 Z" fill="#000000" fill-opacity="0.6" filter="url(#shadow)" />
    <!-- Extruded Prism Top Face -->
    <path d="M 0 40 L 260 170 L 0 300 L -260 170 Z" fill="#090f22" stroke="#EC4899" stroke-width="2" />
    <!-- Left Face -->
    <path d="M -260 170 L 0 300 L 0 360 L -260 230 Z" fill="#040815" stroke="#EC4899" stroke-opacity="0.3" stroke-width="1.5" />
    <!-- Right Face -->
    <path d="M 0 300 L 260 170 L 260 230 L 0 360 Z" fill="#060c1d" stroke="#EC4899" stroke-opacity="0.5" stroke-width="1.5" />
    <!-- Center Emissive Icon / Glow -->
    <circle cx="0" cy="170" r="50" fill="#EC4899" fill-opacity="0.15" stroke="#EC4899" stroke-width="2" />
    <text x="0" y="185" fill="#ffffff" font-size="44" text-anchor="middle">🛠️</text>
  </g>

  <!-- Bottom Highlight Metric Card -->
  <g transform="translate(120, 780)">
    <rect width="900" height="160" rx="24" fill="#060a16" fill-opacity="0.8" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1.5" />
    <rect x="0" y="0" width="12" height="160" rx="6" fill="#EC4899" />
    <text x="48" y="70" fill="#EC4899" font-family="monospace" font-size="36" font-weight="900" letter-spacing="1">
      Instant Diagnosis
    </text>
    <text x="48" y="115" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="20" font-weight="600">
      Detects Body Mutation, Expired TTL &amp; Bad Secrets
    </text>
  </g>

  <!-- Watermark / Brand Footer -->
  <g transform="translate(120, 1000)">
    <text x="0" y="0" fill="#64748b" font-family="monospace" font-size="16">
      GIDEON ARCHITECTURAL SERIES • WEBHOOK PAYLOAD DEBUGGER • GIDEONBAWA.DEV
    </text>
  </g>
</svg>