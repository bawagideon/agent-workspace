<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow-overlap-crimson" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="12" flood-color="#3B0508" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- Deep Crimson Red Background -->
  <rect width="800" height="400" rx="24" fill="#8B0000"/>

  <!-- Interlocking White Arrows Mark -->
  <g transform="translate(400, 140)">
    <!-- Bottom-Right Secondary Chevron -->
    <polygon points="20,10 95,10 35,90 20,90 20,40" fill="#E2E8F0"/>

    <!-- Top-Left Primary Chevron with Depth Shadow -->
    <polygon points="-65,-70 50,-70 -10,35 -65,-70" fill="#FFFFFF" filter="url(#shadow-overlap-crimson)"/>
    <polygon points="-65,-70 50,-70 -10,35 -65,-70" fill="#FFFFFF"/>
  </g>

  <!-- Bold Modern Typography: GIDEON HQ -->
  <text x="400" y="325" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-0.03em" text-anchor="middle">GIDEON HQ</text>
</svg>
