<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="400" viewBox="0 0 800 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Soft drop shadow for overlapping chevron triangle -->
    <filter id="shadow-overlap" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
    <linearGradient id="red-chevron-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
  </defs>

  <!-- Pitch Black Obsidian Background -->
  <rect width="800" height="400" rx="24" fill="#050507"/>

  <!-- Interlocking Red Arrows Mark -->
  <g transform="translate(400, 140)">
    <!-- Bottom-Right Secondary Chevron -->
    <polygon points="20,10 95,10 35,90 20,90 20,40" fill="#991B1B"/>

    <!-- Top-Left Primary Chevron with Depth Shadow -->
    <polygon points="-65,-70 50,-70 -10,35 -65,-70" fill="url(#red-chevron-grad)" filter="url(#shadow-overlap)"/>
    <polygon points="-65,-70 50,-70 -10,35 -65,-70" fill="url(#red-chevron-grad)"/>
  </g>

  <!-- Bold Modern Typography: GIDEON HQ -->
  <text x="400" y="325" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="64" font-weight="900" letter-spacing="-0.03em" text-anchor="middle">GIDEON HQ</text>
</svg>
